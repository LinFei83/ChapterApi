<div data-role="page" class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-button,emby-select,emby-checkbox,emby-linkbutton,emby-input"
     data-controller="__plugin/detect.js">
    <div data-role="content">
        <div class="content-primary">
            <h3>片头检测任务</h3>

            <table style="width: 100%">
                <tr>
                    <td>
                        <table>
                            <tr>
                                <td>
                                    <select id="series_list"></select>
                                    <select id="season_list">
                                        <option value='-1'>全部季</option>
                                    </select>
                                    <select id="episode_list">
                                        <option value='-1'>全部集</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td><input type="checkbox" id="chapters_auto_insert" /> 自动插入检测到的片头章节</td>
                            </tr>
                            <tr>
                                <td>
                                    片头信息数据（可选）<br />
                                    留空则使用内置片头数据库，<strong>或</strong>选择片头信息 JSON 文件 <input type="file" id="theme_info_file" />
                                </td>
                            </tr>
                            <tr>
                                <td><button id="run_detection">添加任务</button></td>
                            </tr>
                        </table>
                    </td>
                    <td align="right">

                    </td>
                </tr>
            </table>


            <hr />
            <button id="refresh_jobs">刷新</button>

            <table style="width:100%;">
                <tr>

                    <td style="width:25%;" valign="top">
                        <div id="table-wrapper" style="position: relative; border: 1px solid;">
                            <div id="table-scroll" style="height: 400px; width: 100%; overflow: auto;">
                                <table id="job_list" style="table-layout: fixed; width:100%;"> </table>
                            </div>
                        </div>
                    </td>

                    <td style="width:75%; padding-left:20px;" valign="top">

                        <div id="job_info">
                        </div>

                        <div id="add_chapters_form">
                        </div>

                        <br />
                        <table style="table-layout: fixed; width: 100%;">
                            <thead>
                                <tr>
                                    <th style="text-align: left; width:35px;"></th>
                                    <th style="text-align: left;">名称</th>
                                    <th style="text-align: left; width: 100px;">片头开始</th>
                                    <th style="text-align: left; width: 100px;">片头结束</th>
                                    <th style="text-align: right; width: 75px;">耗时</th>
                                    <th style="text-align: center; width: 50px;">找到</th>
                                </tr>
                            </thead>
                            <tbody id="job_item_list">
                            </tbody>
                        </table>

                    </td>
                </tr>
            </table>

        </div>
    </div>
</div>
