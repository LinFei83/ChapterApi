<div data-role="page" class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-button,emby-select,emby-checkbox,emby-linkbutton,emby-input"
     data-controller="__plugin/chapters.js">
    <div data-role="content">
        <div class="content-primary">
            <h3>章节</h3>
            <div>选择一个媒体项以查看或编辑其章节。</div>

            <table style="width:100%;">
                <tr>
                    <td style="text-align: left; width: 3em; white-space: nowrap; vertical-align: middle;">搜索</td>
                    <td style="text-align: left;"><input id="search_text" type="text" /></td>
                </tr>
                <tr>
                    <td style="text-align: left; width: 3em; white-space: nowrap; vertical-align: middle;">路径</td>
                    <td style="text-align: left;"><span id="path_string" style="padding: 2px 10px 2px 5px;"></span></td>
                </tr>
            </table>

            <table style="width:100%;">
                <tr>
                    <td style="width:33%;" valign="top">

                        <div id="table-wrapper" style="position: relative; border: 1px solid;">
                            <div id="table-scroll" style="height: 650px; width: 100%; overflow: auto;">
                                <table id="item_list" style="table-layout: fixed; width:100%;">
                                </table>
                            </div>
                        </div>

                        <input type="checkbox" id="show_images" /> 显示图片

                    </td>
                    <td style="width:66%; padding-left:20px;" valign="top" >

                        <div id="display_item_info">
                        </div>

                        <div style="display: none;" id="chapter_table">
                            <h3>章节列表</h3>
                            <input type="hidden" id="add_item_id" />
                            <table style="table-layout: fixed; width: 100%;">
                                <thead>
                                    <tr>
                                        <th style="text-align: left;">名称</th>
                                        <th style="text-align: left;">类型</th>
                                        <th style="text-align: left;">时间</th>
                                        <th style="text-align: left; width: 100px;"></th>
                                    </tr>
                                    <tr>
                                        <th style="text-align: left;">
                                            <input type="text" id="add_name" />
                                        </th>
                                        <th style="text-align: left;">
                                            <select id="add_type">
                                                <option value="chapter">章节</option>
                                                <option value="intro_start">片头开始</option>
                                                <option value="intro_end">片头结束</option>
                                                <option value="credits_start">片尾开始</option>
                                            </select>
                                        </th>
                                        <th style="text-align: left;">
                                            <input type="text" maxlength="2" size="2" value="00" id="add_hour" />:<input type="text" maxlength="2" size="2" value="00" id="add_minute" />:<input type="text" maxlength="2" size="2" value="00" id="add_second" />.<input type="text" maxlength="3" size="3" value="000" id="add_msecond" />
                                        </th>
                                        <th style="text-align: center;">
                                            <button id="add_chapter_button">添加</button>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody id="display_chapter_list">
                                </tbody>
                            </table>
                        </div>

                        <div style="display: none;" id="episodes_table">
                            <h3>季片头摘要</h3>
                            <table style="table-layout: fixed; width: 100%;">
                                <thead>
                                    <tr>
                                        <th style="text-align: left;">名称</th>
                                        <th style="text-align: left; width: 95px;">片头开始</th>
                                        <th style="text-align: left; width: 95px;">片头结束</th>
                                        <th style="text-align: left; width: 95px;">时长</th>
                                        <th style="text-align: left; width: 95px;">片尾</th>
                                        <th style="text-align: left; width: 60px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="display_episode_list">
                                </tbody>
                            </table>
                        </div>

                        <div style="display: none;" id="create_chapters">

                            <h3>自动创建章节</h3>

                            每隔
                            <select id="auto_chapter_interval">
                                <option value="1">1 分钟</option>
                                <option value="2">2 分钟</option>
                                <option value="3">3 分钟</option>
                                <option value="4">4 分钟</option>
                                <option value="5" selected>5 分钟</option>
                                <option value="7">7 分钟</option>
                                <option value="10">10 分钟</option>
                                <option value="15">15 分钟</option>
                            </select>
                            自动创建新章节，名称为
                            <input type="text" id="auto_chapter_name" value="章节"/>
                            <button id="auto_create_button">创建</button>

                        </div>

                    </td>
                </tr>
            </table>



        </div>
    </div>
</div>
